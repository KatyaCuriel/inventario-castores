<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-4">

        <div class="card">

            <div class="card-body">

                <h3 class="text-center mb-4">
                    Iniciar Sesión
                </h3>

                <form th:action="@{/login}" method="post">

                    <div class="mb-3">

                        <label>Correo</label>

                        <input type="text"
                               name="correo"
                               class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control">

                    </div>

                    <button class="btn btn-primary w-100">
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
