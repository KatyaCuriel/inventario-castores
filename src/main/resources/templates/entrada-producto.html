<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Entrada Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card">

            <div class="card-body">

                <h2 class="mb-4">
                    Entrada Inventario
                </h2>

                <h5 th:text="${producto.nombre}">
                </h5>

                <form th:action="@{/productos/entrada}"
                      method="post">

                    <input type="hidden"
                           name="idProducto"
                           th:value="${producto.id}">

                    <div class="mb-3">

                        <label>Cantidad</label>

                        <input type="number"
                               name="cantidad"
                               class="form-control"
                               required>

                    </div>

                    <button class="btn btn-success">

                        Guardar Entrada

                    </button>

                    <a href="/productos"
                       class="btn btn-secondary">

                        Volver

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
