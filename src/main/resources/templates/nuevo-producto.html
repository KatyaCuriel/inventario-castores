<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Producto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-5">

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card">

            <div class="card-body">

                <h2 class="mb-4">
                    Nuevo Producto
                </h2>

                <form th:action="@{/productos/guardar}"
                      th:object="${producto}"
                      method="post">

                    <div class="mb-3">

                        <label>Nombre</label>

                        <input type="text"
                               th:field="*{nombre}"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Descripción</label>

                        <textarea
                                th:field="*{descripcion}"
                                class="form-control">
                        </textarea>

                    </div>

                    <button class="btn btn-success">

                        Guardar Producto

                    </button>

                    <a href="/productos"
                       class="btn btn-secondary">

                        Volver

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>
