<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Historial Movimientos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <form method="get"
          action="/movimientos"
          class="mb-3">

        <select name="tipo"
                class="form-select w-25">

            <option value="">
                TODOS
            </option>

            <option value="ENTRADA">
                ENTRADAS
            </option>

            <option value="SALIDA">
                SALIDAS
            </option>

        </select>

        <button class="btn btn-primary mt-2">
            Filtrar
        </button>

    </form>
</head>

<body class="container mt-5">

<div class="d-flex justify-content-between mb-4">

    <h1>Historial Movimientos</h1>

    <a href="/productos"
       class="btn btn-secondary">

        Volver Productos

    </a>

</div>

<table class="table table-bordered table-hover">

    <thead class="table-dark">

    <tr>

        <th>ID</th>
        <th>Tipo</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Fecha</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="movimiento : ${movimientos}">

        <td th:text="${movimiento.id}"></td>

        <td>

            <span
                    th:if="${movimiento.tipoMovimiento == 'ENTRADA'}"
                    class="badge bg-success">

                ENTRADA

            </span>

            <span
                    th:if="${movimiento.tipoMovimiento == 'SALIDA'}"
                    class="badge bg-danger">

                SALIDA

            </span>

        </td>

        <td th:text="${movimiento.producto.nombre}"></td>

        <td th:text="${movimiento.cantidad}"></td>

        <td th:text="${movimiento.fecha}"></td>

    </tr>

    </tbody>

</table>

</body>

</html>
